<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f0f2f5; padding:16px; font-size:.83rem; }
    .panel { background:#fff; padding:16px; border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,.08); margin-bottom:16px; }
    th { white-space:nowrap; font-size:.79rem; background:#e9ecef !important; cursor:pointer; user-select:none; position:sticky; top:0; z-index:1; }
    th:hover { background:#d1d5db !important; }
    td { white-space:nowrap; font-size:.79rem; vertical-align:middle; }
    .tbl-wrap { max-height:520px; overflow-y:auto; }
    .sort-icon { font-size:.65rem; color:#999; margin-left:2px; }
    .badge-best  { background:#d1fae5; color:#065f46; padding:2px 8px; border-radius:10px; font-size:.73rem; font-weight:600; }
    .badge-needs { background:#fee2e2; color:#991b1b; padding:2px 8px; border-radius:10px; font-size:.73rem; font-weight:600; }
    .badge-avg   { background:#e5e7eb; color:#374151; padding:2px 8px; border-radius:10px; font-size:.73rem; font-weight:600; }
    .score-hi { color:#059669; font-weight:700; }
    .score-md { color:#d97706; font-weight:700; }
    .score-lo { color:#dc2626; font-weight:700; }
    .bar-wrap { display:inline-block; width:44px; height:5px; background:#e5e7eb; border-radius:3px; vertical-align:middle; margin-left:3px; }
    .bar-fill  { height:100%; border-radius:3px; }
    .info-row { font-size:.77rem; color:#6b7280; margin-top:4px; }
    .nav-tabs .nav-link { font-size:.84rem; }
    .nav-tabs .nav-link.active { font-weight:600; }
    .tab-panel { border-top:none; border-radius:0 0 10px 10px; }
    /* Row color by tag */
    tr.row-best  > td { background:#f0fdf4 !important; }
    tr.row-needs > td { background:#fff5f5 !important; }
    tr.row-best:hover  > td { background:#dcfce7 !important; }
    tr.row-needs:hover > td { background:#fee2e2 !important; }
    /* Score breakdown columns — hidden until expanded */
    .score-col { display:none; }
    .scores-open .score-col { display:table-cell; }
    /* India rank */
    .rank-badge { display:inline-block; min-width:30px; text-align:center; background:#f3f4f6; border-radius:6px; padding:1px 4px; font-weight:700; font-size:.73rem; color:#374151; }
    .rank-top10 { background:#fef3c7; color:#92400e; }
    /* Legend */
    .legend-box {
      position:fixed; bottom:18px; right:18px; z-index:999;
      background:#fff; border:1px solid #e5e7eb; border-radius:10px;
      padding:9px 13px; box-shadow:0 2px 10px rgba(0,0,0,.14); font-size:.77rem;
    }
    .legend-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  </style>
</head>
<body>

<script type="application/json" id="gs-payload"><?!= jsonData ?></script>
<div id="err-banner" class="text-center" style="display:none;padding:40px"></div>

<div id="app" class="container-fluid px-2" style="display:none">

  <!-- Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <div>
      <h5 class="mb-0 fw-bold">Picker Performance Dashboard</h5>
      <div class="info-row" id="data-period-label"></div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <a href="https://docs.google.com/spreadsheets/d/13p0haCwj5YUhTyyapvU-haCGLLYPT4XShNhGRv5_QQI/edit"
         target="_blank" class="btn btn-sm btn-outline-secondary">📊 Source Sheet</a>
      <button class="btn btn-sm btn-success" onclick="downloadCSV()">⬇ Download CSV</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="panel">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-2">
        <label class="form-label mb-1">Date From</label>
        <input type="date" id="f-date-from" class="form-control form-control-sm fi">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label mb-1">Date To</label>
        <input type="date" id="f-date-to" class="form-control form-control-sm fi">
      </div>
      <div class="col-6 col-md-1">
        <label class="form-label mb-1">Zone</label>
        <select id="f-zone" class="form-select form-select-sm fi"><option value="All">All</option></select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label mb-1">City</label>
        <select id="f-city" class="form-select form-select-sm fi"><option value="All">All</option></select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label mb-1">City Head</label>
        <select id="f-cityhead" class="form-select form-select-sm fi"><option value="All">All</option></select>
      </div>
      <div class="col-6 col-md-1">
        <label class="form-label mb-1">Store</label>
        <select id="f-store" class="form-select form-select-sm fi"><option value="All">All</option></select>
      </div>
      <div class="col-6 col-md-1">
        <label class="form-label mb-1">Order Slab</label>
        <select id="f-slab" class="form-select form-select-sm">
          <option value="all">All</option>
          <option value="lt100">&lt; 100</option>
          <option value="100-200">100–200</option>
          <option value="200-500">200–500</option>
          <option value="gt500">&gt; 500</option>
        </select>
      </div>
      <div class="col-8 col-md-2">
        <label class="form-label mb-1">Search Picker</label>
        <input type="text" id="f-picker" class="form-control form-control-sm" placeholder="Picker ID…">
      </div>
      <div class="col-4 col-md-1">
        <button id="reset-btn" class="btn btn-sm btn-outline-secondary w-100">Reset</button>
      </div>
    </div>
    <div class="info-row mt-2" id="scoring-note"></div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="mainTabs">
    <li class="nav-item"><button class="nav-link active" onclick="showTab('summary')">Score Summary</button></li>
    <li class="nav-item"><button class="nav-link" onclick="showTab('detail')">Picker Details</button></li>
  </ul>

  <!-- Summary Tab -->
  <div id="tab-summary" class="panel tab-panel">
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <span class="fw-semibold" id="summary-title">Score Summary</span>
      <div class="d-flex align-items-center gap-2">
        <label class="text-muted" style="font-size:.78rem;white-space:nowrap">Group by:</label>
        <select id="summary-groupby" class="form-select form-select-sm" style="width:auto" onchange="renderAll()">
          <option value="Stores">Store</option>
          <option value="City.Final">City</option>
          <option value="Zone">Zone</option>
          <option value="City Head.Final">City Head</option>
        </select>
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="table table-hover table-bordered table-sm mb-0">
        <thead id="summary-thead"></thead>
        <tbody id="summary-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Detail Tab -->
  <div id="tab-detail" class="panel tab-panel d-none">
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <span class="fw-semibold text-muted" id="detail-count"></span>
      <button class="btn btn-sm btn-outline-secondary" id="score-toggle-btn" onclick="toggleScores()">▶ Show Score Breakdown</button>
    </div>
    <div class="tbl-wrap">
      <table class="table table-hover table-bordered table-sm mb-0" id="detail-table">
        <thead><tr id="detail-thead-row"></tr></thead>
        <tbody id="detail-tbody"></tbody>
      </table>
    </div>
    <div class="text-center mt-2 d-none" id="detail-load-more">
      <button class="btn btn-sm btn-outline-secondary" onclick="loadMoreDetail()">Load more rows</button>
      <span class="text-muted ms-2" id="detail-page-info" style="font-size:.77rem"></span>
    </div>
  </div>

</div><!-- #app -->

<!-- Corner legend -->
<div class="legend-box" id="legend-box" style="display:none">
  <div class="fw-semibold mb-1" style="font-size:.79rem">Performance Tag</div>
  <div class="mb-1"><span class="legend-dot" style="background:#10b981"></span>Best &nbsp;(top 25% in store)</div>
  <div class="mb-1"><span class="legend-dot" style="background:#9ca3af"></span>Average</div>
  <div><span class="legend-dot" style="background:#f87171"></span>Needs Improvement</div>
</div>

<script>
// ── Parse GAS payload ──────────────────────────────────────────────────
var RAW_DATA;
(function() {
  try {
    var txt = document.getElementById('gs-payload').textContent;
    var p = JSON.parse(txt);
    if (p && p.error) { RAW_DATA = p; return; }
    if (p && p.h && p.r) {
      RAW_DATA = p.r.map(function(row) {
        var o = {};
        p.h.forEach(function(k,i){ o[k]=row[i]; });
        return o;
      });
    } else { RAW_DATA = []; }
  } catch(e) { RAW_DATA = {error:'JSON parse error: '+e.message}; }
})();

// ── State ──────────────────────────────────────────────────────────────
var masterData=[], scoredData=[], filteredScored=[];
var SCORE_METRICS=['_infUnitPct','_misshipUnitPct','_missingUnitPct','_avgInstoreUnitMin'];
var detailSortKey='_totalScore', detailSortAsc=false;
var summarySortKey='_avgScore',  summarySortAsc=false;
var scoresOpen=false, detailPage=1;
var PAGE=150;
var _scoreCols=[], _hasPRTO=false, _MX=0;

// ── Init ───────────────────────────────────────────────────────────────
window.onload = function() {
  var raw = RAW_DATA;
  if (raw && raw.error) {
    show('err-banner','<div class="text-danger fw-semibold mb-2">Server error</div><div class="text-muted" style="font-size:.85rem">'+raw.error+'</div>');
    return;
  }
  if (!Array.isArray(raw) || raw.length===0) {
    show('err-banner','<div class="text-warning fw-semibold mb-1">No data rows found.</div><div class="text-muted" style="font-size:.85rem">Push data via your pipeline and re-deploy.</div>');
    return;
  }

  _hasPRTO = raw[0].hasOwnProperty('Total_PRTO');
  if (_hasPRTO) SCORE_METRICS.push('_pRTOPct');
  _MX = SCORE_METRICS.length * 10;

  masterData = raw.map(function(r) {
    r._displayDate        = String(r['Date']||'').substring(0,10);
    r['Zone']             = String(r['Zone']             ||'');
    r['City.Final']       = String(r['City.Final']       ||'');
    r['City Head.Final']  = String(r['City Head.Final']  ||'');
    r['Stores']           = String(r['Stores']           ||'');
    r['Picker_ID']        = String(r['Picker_ID']        ||'');
    return r;
  });

  var dates = masterData.map(function(r){return r._displayDate;}).filter(Boolean).sort();
  if (dates.length) {
    el('f-date-from').value = dates[0];
    el('f-date-to').value   = dates[dates.length-1];
    el('data-period-label').textContent =
      'Data: '+dates[0]+' → '+dates[dates.length-1]+
      '  ('+new Set(dates).size+' day(s), '+masterData.length.toLocaleString()+' records)';
  }

  document.querySelectorAll('.fi').forEach(function(e){e.addEventListener('change',applyFilters);});
  el('f-picker').addEventListener('input', renderAll);
  el('f-slab').addEventListener('change', renderAll);
  el('reset-btn').addEventListener('click', resetFilters);

  show('app');
  show('legend-box');
  buildDetailHeader();
  applyFilters();
};

function show(id,html){ var d=el(id); d.style.display=''; if(html!==undefined) d.innerHTML=html; }
function el(id){ return document.getElementById(id); }

// ── Filters ────────────────────────────────────────────────────────────
function getF() {
  return {
    dateFrom:el('f-date-from').value, dateTo:el('f-date-to').value,
    zone:el('f-zone').value, city:el('f-city').value,
    cityHead:el('f-cityhead').value, store:el('f-store').value
  };
}
function rowPasses(r,f) {
  if (f.dateFrom && r._displayDate < f.dateFrom) return false;
  if (f.dateTo   && r._displayDate > f.dateTo)   return false;
  if (f.zone    !=='All' && r['Zone']           !==f.zone)     return false;
  if (f.city    !=='All' && r['City.Final']     !==f.city)     return false;
  if (f.cityHead!=='All' && r['City Head.Final']!==f.cityHead) return false;
  if (f.store   !=='All' && r['Stores']         !==f.store)    return false;
  return true;
}
function slabPasses(p,slab) {
  var o=p.Total_Orders;
  if (slab==='lt100')   return o<100;
  if (slab==='100-200') return o>=100 && o<=200;
  if (slab==='200-500') return o>200  && o<=500;
  if (slab==='gt500')   return o>500;
  return true;
}
function applyFilters() {
  var f=getF();
  updDrop('f-zone',    'Zone',           'zone',     f);
  updDrop('f-city',    'City.Final',     'city',     f);
  updDrop('f-cityhead','City Head.Final','cityHead', f);
  updDrop('f-store',   'Stores',         'store',    f);
  var filtered = masterData.filter(function(r){return rowPasses(r,f);});
  scoredData = assignIndiaRank(scoreStoreWise(aggregatePickers(filtered)));
  el('scoring-note').textContent =
    'Scores: store-wise relative 0–10 per metric (max '+_MX+'). '+
    'India Rank = global rank across all pickers in current view by total score.';
  renderAll();
}
function updDrop(elId,rowKey,fKey,f) {
  var tmp=Object.assign({},f); tmp[fKey]='All';
  var opts={};
  masterData.forEach(function(r){ if(rowPasses(r,tmp)&&r[rowKey]) opts[r[rowKey]]=1; });
  var sel=el(elId), cur=f[fKey];
  sel.innerHTML='<option value="All">All</option>';
  Object.keys(opts).sort().forEach(function(v){
    var o=document.createElement('option'); o.value=v; o.textContent=v;
    if(v===cur) o.selected=true;
    sel.appendChild(o);
  });
}
function resetFilters() {
  document.querySelectorAll('select.fi').forEach(function(s){s.value='All';});
  el('f-picker').value=''; el('f-slab').value='all';
  var dates=masterData.map(function(r){return r._displayDate;}).filter(Boolean).sort();
  if(dates.length){el('f-date-from').value=dates[0];el('f-date-to').value=dates[dates.length-1];}
  applyFilters();
}

// ── Aggregation ────────────────────────────────────────────────────────
function aggregatePickers(rows) {
  var map={};
  rows.forEach(function(r) {
    var key=r['Picker_ID']+'||'+r['Stores'];
    if (!map[key]) map[key]={
      Picker_ID:r['Picker_ID'],Stores:r['Stores'],Zone:r['Zone'],
      'City.Final':r['City.Final'],'City Head.Final':r['City Head.Final'],
      _o:0,_u:0,_inf:0,_mis:0,_mss:0,_sec:0,_rto:0,_ret:0
    };
    var p=map[key];
    p._o  +=+r['Total_Orders']           ||0;
    p._u  +=+r['Total_Units']            ||0;
    p._inf+=+r['Total_INF']              ||0;
    p._mis+=+r['Total_Misshipment']      ||0;
    p._mss+=+r['Total_Missing_Item']     ||0;
    p._sec+=+r['Total_Instore_Time_Sec'] ||0;
    p._rto+=+r['Total_PRTO']             ||0;
    p._ret+=+r['Total_Returns']          ||0;
  });
  return Object.values(map).map(function(p) {
    var o=p._o, u=p._u;
    p.Total_Orders=o; p.Total_Units=u;
    p.Total_INF=p._inf; p.Total_Misshipment=p._mis;
    p.Total_Missing_Item=p._mss; p.Total_Returns=p._ret; p.Total_PRTO=p._rto;
    p._avgInstoreUnitMin = u>0 ? +((p._sec/u)/60).toFixed(3) : 0;
    p._infUnitPct        = u>0 ? +(p._inf/u*100).toFixed(3)  : 0;
    p._misshipUnitPct    = u>0 ? +(p._mis/u*100).toFixed(3)  : 0;
    p._missingUnitPct    = u>0 ? +(p._mss/u*100).toFixed(3)  : 0;
    p._pRTOPct           = o>0 ? +(p._rto/o*100).toFixed(3)  : 0;
    return p;
  });
}

// ── Scoring ────────────────────────────────────────────────────────────
function scoreStoreWise(pickers) {
  var stores={};
  pickers.forEach(function(p){ (stores[p.Stores]=stores[p.Stores]||[]).push(p); });
  Object.values(stores).forEach(function(grp) {
    SCORE_METRICS.forEach(function(m) {
      var vals=grp.map(function(p){return p[m]||0;});
      var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      grp.forEach(function(p){
        p['_s_'+m] = mx===mn ? 10 : +(10*(1-(p[m]-mn)/(mx-mn))).toFixed(2);
      });
    });
    grp.forEach(function(p){
      p._totalScore=+(SCORE_METRICS.reduce(function(s,m){return s+(p['_s_'+m]||0);},0)).toFixed(2);
    });
    var n=grp.length;
    grp.slice().sort(function(a,b){return b._totalScore-a._totalScore;}).forEach(function(p,rank){
      if(n<=1)                            p._tag='Best';
      else if(n===2)                      p._tag=rank===0?'Best':'Needs Improvement';
      else if(rank<Math.floor(n*.25))     p._tag='Best';
      else if(rank>=n-Math.floor(n*.25))  p._tag='Needs Improvement';
      else                                p._tag='Average';
    });
  });
  return pickers;
}

function assignIndiaRank(pickers) {
  pickers.slice().sort(function(a,b){return b._totalScore-a._totalScore;})
    .forEach(function(p,i){p._indiaRank=i+1;});
  return pickers;
}

// ── Render all ─────────────────────────────────────────────────────────
function renderAll() {
  var search=el('f-picker').value.trim().toLowerCase();
  var slab=el('f-slab').value;
  filteredScored=scoredData.filter(function(p){
    if(search && p.Picker_ID.toLowerCase().indexOf(search)<0) return false;
    return slabPasses(p,slab);
  });
  el('detail-count').textContent=filteredScored.length.toLocaleString()+' pickers';
  detailPage=1;
  renderSummary();
  renderDetail();
}

// ── Summary ────────────────────────────────────────────────────────────
function renderSummary() {
  var gb=el('summary-groupby').value;
  var lbl={'Stores':'Store','City.Final':'City','Zone':'Zone','City Head.Final':'City Head'}[gb];

  var map={};
  filteredScored.forEach(function(p){
    var k=p[gb]||'Unknown';
    if(!map[k]) map[k]={key:k,n:0,orders:0,units:0,inf:0,mis:0,mss:0,rto:0,score:0,best:0,avg:0,needs:0};
    var g=map[k];
    g.n++; g.orders+=p.Total_Orders; g.units+=p.Total_Units;
    g.inf+=p._infUnitPct; g.mis+=p._misshipUnitPct; g.mss+=p._missingUnitPct;
    g.rto+=p._pRTOPct;   g.score+=p._totalScore;
    if(p._tag==='Best') g.best++;
    else if(p._tag==='Needs Improvement') g.needs++;
    else g.avg++;
  });
  var groups=Object.values(map).map(function(g){
    return Object.assign(g,{
      avgINF:g.n?g.inf/g.n:0, avgMis:g.n?g.mis/g.n:0,
      avgMss:g.n?g.mss/g.n:0, avgRTO:g.n?g.rto/g.n:0,
      _avgScore:g.n?g.score/g.n:0
    });
  });
  groups.sort(function(a,b){
    var va=a[summarySortKey],vb=b[summarySortKey];
    if(typeof va==='string') return summarySortAsc?va.localeCompare(vb):vb.localeCompare(va);
    return summarySortAsc?va-vb:vb-va;
  });

  el('summary-title').textContent=lbl+'-wise Score Summary';
  el('summary-thead').innerHTML='<tr>'
    +'<th onclick="sortSummary(\'key\')">'+lbl+' <span class="sort-icon" id="ss-key"></span></th>'
    +'<th onclick="sortSummary(\'n\')">Pickers <span class="sort-icon" id="ss-n"></span></th>'
    +'<th onclick="sortSummary(\'orders\')">Orders <span class="sort-icon" id="ss-orders"></span></th>'
    +'<th onclick="sortSummary(\'units\')">Units <span class="sort-icon" id="ss-units"></span></th>'
    +'<th class="table-warning" onclick="sortSummary(\'avgINF\')">Avg INF% <span class="sort-icon" id="ss-avgINF"></span></th>'
    +'<th class="table-danger"  onclick="sortSummary(\'avgMis\')">Avg Misship% <span class="sort-icon" id="ss-avgMis"></span></th>'
    +'<th class="table-danger"  onclick="sortSummary(\'avgMss\')">Avg Missing% <span class="sort-icon" id="ss-avgMss"></span></th>'
    +(_hasPRTO?'<th class="table-info" onclick="sortSummary(\'avgRTO\')">Avg pRTO% <span class="sort-icon" id="ss-avgRTO"></span></th>':'')
    +'<th class="table-primary" onclick="sortSummary(\'_avgScore\')">Avg Score/'+_MX+' <span class="sort-icon" id="ss-_avgScore"></span></th>'
    +'<th style="color:#059669" onclick="sortSummary(\'best\')">Best <span class="sort-icon" id="ss-best"></span></th>'
    +'<th onclick="sortSummary(\'avg\')">Avg <span class="sort-icon" id="ss-avg"></span></th>'
    +'<th class="text-danger"   onclick="sortSummary(\'needs\')">Needs <span class="sort-icon" id="ss-needs"></span></th>'
    +'</tr>';

  document.querySelectorAll('[id^="ss-"]').forEach(function(e){e.textContent='';});
  var si=el('ss-'+summarySortKey); if(si) si.textContent=summarySortAsc?'▲':'▼';

  var tbody=el('summary-tbody');
  if(!groups.length){tbody.innerHTML='<tr><td colspan="99" class="text-center py-3 text-muted">No data</td></tr>';return;}
  tbody.innerHTML=groups.map(function(g){
    var pct=(g._avgScore/_MX*100).toFixed(0);
    var col=g._avgScore>=_MX*.7?'#059669':g._avgScore>=_MX*.4?'#d97706':'#dc2626';
    return '<tr>'
      +'<td><strong>'+g.key+'</strong></td><td>'+g.n+'</td>'
      +'<td>'+g.orders.toLocaleString()+'</td><td>'+g.units.toLocaleString()+'</td>'
      +'<td class="table-warning">'+g.avgINF.toFixed(2)+'%</td>'
      +'<td class="table-danger">'+g.avgMis.toFixed(2)+'%</td>'
      +'<td class="table-danger">'+g.avgMss.toFixed(2)+'%</td>'
      +(_hasPRTO?'<td class="table-info">'+g.avgRTO.toFixed(2)+'%</td>':'')
      +'<td class="table-primary"><span style="color:'+col+';font-weight:700">'+g._avgScore.toFixed(1)+'</span>'
      +' <span class="bar-wrap"><span class="bar-fill" style="width:'+pct+'%;background:'+col+'"></span></span></td>'
      +'<td><span class="badge-best">'+g.best+'</span></td>'
      +'<td><span class="badge-avg">'+g.avg+'</span></td>'
      +'<td><span class="badge-needs">'+g.needs+'</span></td>'
      +'</tr>';
  }).join('');
}

// ── Detail table header ────────────────────────────────────────────────
function buildDetailHeader() {
  // Fixed always-visible columns
  var cols=[
    ['_indiaRank','India Rank',''],
    ['Picker_ID','Picker ID',''],
    ['Stores','Store',''],
    ['City.Final','City',''],
    ['Zone','Zone',''],
    ['Total_Orders','Orders',''],
    ['Total_Units','Units',''],
    ['Total_INF','INF','table-warning'],
    ['_infUnitPct','INF%','table-warning'],
    ['Total_Misshipment','Misship','table-danger'],
    ['_misshipUnitPct','Misship%','table-danger'],
    ['Total_Missing_Item','Missing','table-danger'],
    ['_missingUnitPct','Missing%','table-danger'],
    ['Total_PRTO','pRTO','table-info'],
    ['_pRTOPct','pRTO%','table-info'],
    ['Total_Returns','Returns',''],
    ['_totalScore','Total Score /'+_MX,'table-primary'],
    ['_tag','Tag','']
  ];

  // Expandable score breakdown columns
  _scoreCols=[
    ['_s__infUnitPct','INF Score /10',''],
    ['_s__misshipUnitPct','Misship Score /10',''],
    ['_s__missingUnitPct','Missing Score /10',''],
    ['_s__avgInstoreUnitMin','Instore Score /10','']
  ];
  if (_hasPRTO) _scoreCols.push(['_s__pRTOPct','pRTO Score /10','']);

  el('detail-thead-row').innerHTML=
    cols.map(function(c){
      if (c[0]==='_tag') return '<th>Tag</th>';
      return '<th class="'+c[2]+'" onclick="sortDetail(\''+c[0]+'\')">'+c[1]+
             ' <span class="sort-icon" id="ds-'+c[0]+'"></span></th>';
    }).join('')
    +'<th class="score-col table-secondary" colspan="'+_scoreCols.length+'" style="text-align:center">Score Breakdown</th>';

  // Add individual score col headers (score-col hidden by default)
  // We'll inject them as separate <th> after rebuild - simpler approach: rebuild fully
  el('detail-thead-row').innerHTML=
    cols.map(function(c){
      if (c[0]==='_tag') return '<th>Tag</th>';
      return '<th class="'+c[2]+'" onclick="sortDetail(\''+c[0]+'\')">'+c[1]+
             ' <span class="sort-icon" id="ds-'+c[0]+'"></span></th>';
    }).join('')
    +_scoreCols.map(function(c){
      return '<th class="score-col table-secondary" onclick="sortDetail(\''+c[0]+'\')">'+c[1]+
             ' <span class="sort-icon" id="ds-'+c[0]+'"></span></th>';
    }).join('');
}

function toggleScores() {
  scoresOpen=!scoresOpen;
  el('detail-table').classList.toggle('scores-open',scoresOpen);
  el('score-toggle-btn').textContent=scoresOpen?'▼ Hide Score Breakdown':'▶ Show Score Breakdown';
}

// ── Detail table render ────────────────────────────────────────────────
function renderDetail() {
  var data=filteredScored.slice().sort(function(a,b){
    var va=a[detailSortKey]!=null?a[detailSortKey]:'',
        vb=b[detailSortKey]!=null?b[detailSortKey]:'';
    if(typeof va==='string') return detailSortAsc?va.localeCompare(vb):vb.localeCompare(va);
    return detailSortAsc?va-vb:vb-va;
  });

  document.querySelectorAll('[id^="ds-"]').forEach(function(e){e.textContent='';});
  var dsi=el('ds-'+detailSortKey); if(dsi) dsi.textContent=detailSortAsc?'▲':'▼';

  var tbody=el('detail-tbody');
  if(!data.length){
    tbody.innerHTML='<tr><td colspan="99" class="text-center py-3 text-muted">No data</td></tr>';
    el('detail-load-more').classList.add('d-none');
    return;
  }

  var pageData=data.slice(0, detailPage*PAGE);
  tbody.innerHTML=pageData.map(function(p){
    var pct=(p._totalScore/_MX*100).toFixed(0);
    var cls=p._totalScore>=_MX*.7?'score-hi':p._totalScore>=_MX*.4?'score-md':'score-lo';
    var col=p._totalScore>=_MX*.7?'#059669':p._totalScore>=_MX*.4?'#d97706':'#dc2626';
    var rowCls=p._tag==='Best'?'row-best':p._tag==='Needs Improvement'?'row-needs':'';
    var rkCls=p._indiaRank<=10?'rank-badge rank-top10':'rank-badge';
    var tag=p._tag==='Best'?'<span class="badge-best">Best</span>'
      :p._tag==='Needs Improvement'?'<span class="badge-needs">Needs Impv</span>'
      :'<span class="badge-avg">Average</span>';
    return '<tr class="'+rowCls+'">'
      +'<td><span class="'+rkCls+'">#'+p._indiaRank+'</span></td>'
      +'<td><strong>'+p.Picker_ID+'</strong></td>'
      +'<td>'+p.Stores+'</td>'
      +'<td>'+p['City.Final']+'</td>'
      +'<td>'+p.Zone+'</td>'
      +'<td>'+p.Total_Orders.toLocaleString()+'</td>'
      +'<td>'+p.Total_Units.toLocaleString()+'</td>'
      +'<td class="table-warning">'+p.Total_INF+'</td>'
      +'<td class="table-warning">'+p._infUnitPct.toFixed(2)+'%</td>'
      +'<td class="table-danger">'+p.Total_Misshipment+'</td>'
      +'<td class="table-danger">'+p._misshipUnitPct.toFixed(2)+'%</td>'
      +'<td class="table-danger">'+p.Total_Missing_Item+'</td>'
      +'<td class="table-danger">'+p._missingUnitPct.toFixed(2)+'%</td>'
      +'<td class="table-info">'+p.Total_PRTO+'</td>'
      +'<td class="table-info">'+((p._pRTOPct||0)).toFixed(2)+'%</td>'
      +'<td>'+p.Total_Returns+'</td>'
      +'<td class="table-primary"><span class="'+cls+'">'+p._totalScore.toFixed(1)+'</span>'
      +' <span class="bar-wrap"><span class="bar-fill" style="width:'+pct+'%;background:'+col+'"></span></span></td>'
      +'<td>'+tag+'</td>'
      +_scoreCols.map(function(c){
        return '<td class="score-col table-secondary">'+((p[c[0]]||0)).toFixed(1)+'/10</td>';
      }).join('')
      +'</tr>';
  }).join('');

  if (data.length > detailPage*PAGE) {
    el('detail-load-more').classList.remove('d-none');
    el('detail-page-info').textContent='Showing '+pageData.length+' of '+data.length;
  } else {
    el('detail-load-more').classList.add('d-none');
  }
}

function loadMoreDetail(){ detailPage++; renderDetail(); }

function sortDetail(k){
  if(detailSortKey===k) detailSortAsc=!detailSortAsc;
  else{detailSortKey=k; detailSortAsc=typeof((filteredScored[0]||{})[k])==='string';}
  detailPage=1; renderDetail();
}
function sortSummary(k){
  if(summarySortKey===k) summarySortAsc=!summarySortAsc;
  else{summarySortKey=k; summarySortAsc=k==='key';}
  renderSummary();
}
function showTab(tab){
  el('tab-summary').classList.toggle('d-none',tab!=='summary');
  el('tab-detail').classList.toggle('d-none',tab!=='detail');
  document.querySelectorAll('#mainTabs .nav-link').forEach(function(b,i){
    b.classList.toggle('active',(i===0&&tab==='summary')||(i===1&&tab==='detail'));
  });
}

// ── CSV download ────────────────────────────────────────────────────────
function downloadCSV(){
  var hdrs=['India Rank','Picker ID','Store','City','Zone',
    'Orders','Units','INF','INF%','Misship','Misship%',
    'Missing','Missing%','pRTO','pRTO%','Returns',
    'Total Score /'+_MX,'Tag',
    'INF Score /10','Misship Score /10','Missing Score /10','Instore Score /10']
    .concat(_hasPRTO?['pRTO Score /10']:[]);

  var rows=filteredScored.map(function(p){
    return [p._indiaRank,p.Picker_ID,p.Stores,p['City.Final'],p.Zone,
      p.Total_Orders,p.Total_Units,
      p.Total_INF,p._infUnitPct.toFixed(2),
      p.Total_Misshipment,p._misshipUnitPct.toFixed(2),
      p.Total_Missing_Item,p._missingUnitPct.toFixed(2),
      p.Total_PRTO,((p._pRTOPct||0)).toFixed(2),p.Total_Returns,
      p._totalScore.toFixed(2),p._tag,
      ((p['_s__infUnitPct']     ||0)).toFixed(2),
      ((p['_s__misshipUnitPct'] ||0)).toFixed(2),
      ((p['_s__missingUnitPct'] ||0)).toFixed(2),
      ((p['_s__avgInstoreUnitMin']||0)).toFixed(2)]
      .concat(_hasPRTO?[((p['_s__pRTOPct']||0)).toFixed(2)]:[]);
  });

  var csv=[hdrs].concat(rows).map(function(r){
    return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='picker_performance_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
}
</script>
